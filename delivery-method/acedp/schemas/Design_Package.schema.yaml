# =============================================================================
# Design Package Schema
# -----------------------------------------------------------------------------
# Schema Version:      1.0   (convenience copy; metadata.schema_version is authoritative)
# Status:              Approved
# Approved By:         lead_architect (technical approval)
# Approval Date:       2026-06-30
# Document Reference:  SPEC-005 Design Package
# Source of Truth:     acedp/docs/specifications/SPEC-005_Design_Package.md
# Convention:          STD-001 "Schema Conventions"
#
# Purpose:
#   Documentation-first description of the canonical Design Package record:
#   the design intent produced after Customer Discovery and Engineering Review
#   and before any Mist organization/configuration generation.
#   NOT executable; no validation logic; no example/customer data; no actual
#   network designs or device configuration — this defines structure only.
#
# Common envelope (STD-001):
#   metadata  ->  references  ->  <domain sections>  ->  approvals
#
# Conventions (shared across ACEDP schemas):
#   - Keys/field names use snake_case; identifiers are "<section>_id".
#   - Each field is documented as: { type, required, description }.
#   - "type: list" sections describe a repeating element under "items:".
#   - "type: reference" fields describe a structured external link under "fields:".
#   - Enum values are listed under "allowed:".
#   - metadata.schema_version is the AUTHORITATIVE schema version.
#   - Internal links use a bare local "<section>_id"; external links are structured.
#   - Plan sections capture design INTENT only, never device configuration.
#   - Provisional choices are marked inline with "# OPEN:".
# =============================================================================

# ----------------------------------------------------------------------------
# metadata — about the Design Package record itself
# ----------------------------------------------------------------------------
metadata:
  design_id:
    type: string
    required: true
    description: Stable, unique identifier for this Design Package record.
  design_name:
    type: string
    required: true
    description: Human-readable name of the Design Package.
  schema_version:
    type: string
    required: true
    description: AUTHORITATIVE version of this schema the record conforms to (e.g. "1.0").
  document_reference:
    type: string
    required: true
    description: Source specification. Fixed value "SPEC-005".
  status:
    type: string
    required: true
    description: Lifecycle status of the Design Package record.
    allowed: [Draft, In Review, Approved, Superseded]   # per STD-001
  version:
    type: string
    required: true
    description: Record version as MAJOR.MINOR (per STD-001 versioning).
  created_date:
    type: date
    required: true
    description: Date the record was created (ISO 8601, YYYY-MM-DD).
  last_updated:
    type: date
    required: true
    description: Date the record was last changed (ISO 8601).
  author:
    type: string
    required: false
    description: Role or identity that authored the record.
  owner:
    type: string
    required: false
    description: Role accountable for the record.

# ----------------------------------------------------------------------------
# references — structured links to external artifacts
# (Typically the approved Project Profile (SPEC-001), Customer Discovery
#  (SPEC-002), and the authorizing Engineering Review (SPEC-003).)
# ----------------------------------------------------------------------------
references:
  type: list
  required: false
  description: Structured links to external artifacts or instances.
  items:
    reference_id:
      type: string
      required: true
      description: Local identifier for this reference entry.
    ref_document:
      type: string
      required: true
      description: Source specification or artifact type (e.g. "SPEC-001").
    ref_id:
      type: string
      required: true
      description: Identifier of the referenced instance.
    ref_version:
      type: string
      required: false
      description: Version of the referenced instance, if pinned.
    relationship:
      type: string
      required: false
      description: Nature of the link (e.g. "designed_from", "authorized_by").

# ----------------------------------------------------------------------------
# design_scope — what the design covers
# ----------------------------------------------------------------------------
design_scope:
  objective:
    type: string
    required: true
    description: The design objective this package addresses.
  description:
    type: string
    required: false
    description: Narrative description of the design scope.
  design_type:
    type: string
    required: false
    description: Nature of the design effort.
    allowed: [greenfield, brownfield, migration, expansion]
  in_scope:
    type: list[string]
    required: true
    description: Aspects explicitly within the design's scope.
  out_of_scope:
    type: list[string]
    required: true
    description: Aspects explicitly excluded from the design.

# ----------------------------------------------------------------------------
# high_level_design — HLD
# ----------------------------------------------------------------------------
high_level_design:
  summary:
    type: string
    required: true
    description: Summary of the high-level design.
  architecture_overview:
    type: string
    required: false
    description: Description of the overall architecture.
  topology_description:
    type: string
    required: false
    description: Narrative of the high-level topology.
  design_principles:
    type: list[string]
    required: false
    description: Guiding principles applied to the design.
  diagrams:
    type: list
    required: false
    description: Referenced high-level diagrams (intent, not embedded artifacts).
    items:
      diagram_id:
        type: string
        required: true
        description: Local identifier for the diagram.
      title:
        type: string
        required: false
        description: Diagram title.
      description:
        type: string
        required: false
        description: What the diagram conveys.

# ----------------------------------------------------------------------------
# low_level_design — LLD
# ----------------------------------------------------------------------------
low_level_design:
  summary:
    type: string
    required: false
    description: Summary of the low-level design.
  components:
    type: list
    required: false
    description: Components elaborated at low-level detail.
    items:
      component_id:
        type: string
        required: true
        description: Local identifier for the component.
      name:
        type: string
        required: true
        description: Component name.
      type:
        type: string
        required: false
        description: Category of component.
      description:
        type: string
        required: false
        description: Role of the component in the design.
      configuration_intent:
        type: string
        required: false
        description: Intended behavior in plain language (NOT device configuration).
  dependencies:
    type: list[string]
    required: false
    description: Dependencies between components or on external factors.

# ----------------------------------------------------------------------------
# vlan_ip_plan — VLAN and IP addressing intent
# ----------------------------------------------------------------------------
vlan_ip_plan:
  vlans:
    type: list
    required: false
    description: Planned VLANs (definitions only; no customer data).
    items:
      vlan_id:
        type: string
        required: true
        description: Local identifier for the VLAN entry.
      vlan_number:
        type: integer
        required: false
        description: Intended VLAN number.
      name:
        type: string
        required: false
        description: VLAN name.
      purpose:
        type: string
        required: false
        description: What the VLAN is for.
      l3_gateway:
        type: boolean
        required: false
        description: Whether the VLAN has an L3 gateway.
  ip_subnets:
    type: list
    required: false
    description: Planned IP subnets.
    items:
      subnet_id:
        type: string
        required: true
        description: Local identifier for the subnet entry.
      cidr:
        type: string
        required: false
        description: Intended subnet in CIDR notation.
      purpose:
        type: string
        required: false
        description: What the subnet serves.
      vlan_ref:
        type: string
        required: false
        description: Internal link to a vlan_ip_plan.vlans.vlan_id.
  addressing_notes:
    type: string
    required: false
    description: Narrative addressing guidance.

# ----------------------------------------------------------------------------
# wlan_ssid_plan — wireless SSID intent
# ----------------------------------------------------------------------------
wlan_ssid_plan:
  ssids:
    type: list
    required: false
    description: Planned SSIDs.
    items:
      ssid_id:
        type: string
        required: true
        description: Local identifier for the SSID entry.
      name:
        type: string
        required: false
        description: SSID name.
      purpose:
        type: string
        required: false
        description: Intended use of the SSID.
      security_type:
        type: string
        required: false
        description: Intended security model.
        allowed: [open, psk, enterprise]
      band:
        type: string
        required: false
        description: Intended band(s).
        allowed: ['2_4ghz', '5ghz', '6ghz', dual_band, tri_band]
      vlan_ref:
        type: string
        required: false
        description: Internal link to a vlan_ip_plan.vlans.vlan_id.
  wlan_notes:
    type: string
    required: false
    description: Narrative wireless guidance.

# ----------------------------------------------------------------------------
# switching_plan — wired switching intent
# ----------------------------------------------------------------------------
switching_plan:
  switches:
    type: list
    required: false
    description: Planned switching roles (definitions only).
    items:
      switch_id:
        type: string
        required: true
        description: Local identifier for the switch entry.
      role:
        type: string
        required: false
        description: Intended role in the topology.
        allowed: [access, distribution, core, collapsed_core]
      description:
        type: string
        required: false
        description: Role of this switch in the design.
      port_profile_intent:
        type: string
        required: false
        description: Intended port behavior in plain language (NOT configuration).
  uplinks:
    type: list
    required: false
    description: Planned uplinks between switching tiers.
    items:
      uplink_id:
        type: string
        required: true
        description: Local identifier for the uplink entry.
      from_ref:
        type: string
        required: false
        description: Internal link to a switching_plan.switches.switch_id.
      to_ref:
        type: string
        required: false
        description: Internal link to a switching_plan.switches.switch_id.
      link_type:
        type: string
        required: false
        description: Intended link characteristic (e.g. "aggregated", "routed").
  switching_notes:
    type: string
    required: false
    description: Narrative switching guidance.

# ----------------------------------------------------------------------------
# security_segmentation_plan — segmentation and policy intent
# ----------------------------------------------------------------------------
security_segmentation_plan:
  segments:
    type: list
    required: false
    description: Planned network segments.
    items:
      segment_id:
        type: string
        required: true
        description: Local identifier for the segment entry.
      name:
        type: string
        required: false
        description: Segment name.
      purpose:
        type: string
        required: false
        description: What the segment isolates or serves.
      members:
        type: list[string]
        required: false
        description: Intended members (described generically, not customer data).
  policies:
    type: list
    required: false
    description: Planned segmentation policies (intent only).
    items:
      policy_id:
        type: string
        required: true
        description: Local identifier for the policy entry.
      description:
        type: string
        required: true
        description: The policy intent.
      action:
        type: string
        required: false
        description: Intended action.
        allowed: [permit, deny, inspect]
      source_ref:
        type: string
        required: false
        description: Internal link to a segments.segment_id.
      destination_ref:
        type: string
        required: false
        description: Internal link to a segments.segment_id.
  segmentation_notes:
    type: string
    required: false
    description: Narrative segmentation guidance.

# ----------------------------------------------------------------------------
# mist_organization_readiness — PRELIMINARY design-side self-assessment.
# It may indicate expected readiness, gaps, and dependencies, but it does NOT
# authorize Mist organization preparation and is superseded by the approved
# SPEC-006 Mist Organization Readiness assessment, which is authoritative.
# Downstream Mist Organization Generation requires an approved SPEC-006 record.
# ----------------------------------------------------------------------------
mist_organization_readiness:
  readiness_status:
    type: string
    required: false
    description: >-
      Preliminary, design-side readiness indicator only. It does not authorize
      Mist organization preparation; the authoritative determination is the
      approved SPEC-006 Mist Organization Readiness assessment.
    allowed: [not_ready, partial, ready]
  required_constructs:
    type: list[string]
    required: false
    description: Organization constructs the design implies (described generically).
  prerequisites:
    type: list[string]
    required: false
    description: Conditions that must be met before generation.
  gaps:
    type: list[string]
    required: false
    description: Outstanding items preventing readiness.
  notes:
    type: string
    required: false
    description: Narrative on readiness.

# ----------------------------------------------------------------------------
# customer_documentation — customer-facing documentation intent
# ----------------------------------------------------------------------------
customer_documentation:
  documents:
    type: list
    required: false
    description: Customer-facing documents the package will produce.
    items:
      doc_id:
        type: string
        required: true
        description: Local identifier for the document entry.
      title:
        type: string
        required: false
        description: Document title.
      audience:
        type: string
        required: false
        description: Intended audience.
      purpose:
        type: string
        required: false
        description: Why the document is produced.
  documentation_notes:
    type: string
    required: false
    description: Narrative documentation guidance.

# ----------------------------------------------------------------------------
# risks — risks associated with the design
# ----------------------------------------------------------------------------
risks:
  type: list
  required: false
  description: Risks identified in relation to the design.
  items:
    risk_id:
      type: string
      required: true
      description: Unique identifier for the risk.
    description:
      type: string
      required: true
      description: The risk.
    likelihood:
      type: string
      required: false
      description: Probability of the risk occurring.
      allowed: [high, medium, low]
    impact:
      type: string
      required: false
      description: Consequence if the risk occurs.
      allowed: [high, medium, low]
    rating:
      type: string
      required: false
      description: Overall risk rating.
      allowed: [high, medium, low]
    mitigation:
      type: string
      required: false
      description: Proposed mitigation or response.

# ----------------------------------------------------------------------------
# assumptions — assumptions underlying the design
# ----------------------------------------------------------------------------
assumptions:
  type: list
  required: false
  description: Working assumptions underlying the design.
  items:
    assumption_id:
      type: string
      required: true
      description: Unique identifier for the assumption.
    description:
      type: string
      required: true
      description: The assumption being made.
    status:
      type: string
      required: false
      description: Confirmation state of the assumption.
      allowed: [open, confirmed, invalidated]
    impact:
      type: string
      required: false
      description: Consequence if the assumption proves false.

# ----------------------------------------------------------------------------
# open_questions — unresolved questions about the design
# ----------------------------------------------------------------------------
open_questions:
  type: list
  required: false
  description: Questions left unresolved by the design.
  items:
    question_id:
      type: string
      required: true
      description: Unique identifier for the question.
    description:
      type: string
      required: true
      description: The unresolved question.
    blocking:
      type: boolean
      required: false
      description: Whether this question blocks design approval.
    owner_role:
      type: string
      required: false
      description: Role responsible for resolving the question.
    status:
      type: string
      required: false
      description: Resolution state.
      allowed: [open, answered]

# ----------------------------------------------------------------------------
# approvals — standard review/approval block (design approval)
# ----------------------------------------------------------------------------
approvals:
  type: list
  required: false
  description: Approval decisions taken via Engineering Review (SPEC-003).
  items:
    approval_id:
      type: string
      required: true
      description: Unique identifier for the approval record.
    artifact:
      type: string
      required: true
      description: What is being approved (e.g. "Design Package").
    decision:
      type: string
      required: true
      description: The approval decision.
      allowed: [approved, rejected, pending]
    authority:
      type: string
      required: true
      description: >-
        Canonical actor field — the role that made the decision. See the
        SPEC-003 approval-authority matrix for the authority per artifact class.
      allowed: [product_owner, lead_architect, implementation_engineer]
    review_reference:
      type: reference
      required: false
      description: Structured link to the Engineering Review (SPEC-003) record.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-003".
        ref_id:
          type: string
          required: true
          description: Identifier of the review record.
    date:
      type: date
      required: false
      description: Date of the decision (ISO 8601).
    notes:
      type: string
      required: false
      description: Conditions or rationale attached to the decision.
