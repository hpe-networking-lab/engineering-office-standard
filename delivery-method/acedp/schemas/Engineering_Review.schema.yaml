# =============================================================================
# Engineering Review Schema
# -----------------------------------------------------------------------------
# Schema Version:      1.0   (convenience copy; metadata.schema_version is authoritative)
# Status:              Approved
# Approved By:         lead_architect (technical), product_owner (final acceptance)
# Approval Date:       2026-06-30
# Document Reference:  SPEC-003 Engineering Review
# Source of Truth:     acedp/docs/specifications/SPEC-003_Engineering_Review.md
# Convention:          STD-001 "Schema Conventions"
#
# Purpose:
#   Documentation-first description of the canonical Engineering Review record.
#   An Engineering Review evaluates one or more artifacts against criteria and
#   produces findings, risks, required changes, and an approval decision.
#   NOT executable; no validation logic; no example/customer data.
#
# Common envelope (STD-001):
#   metadata  ->  references  ->  <domain sections>  ->  approvals
#
# Conventions (shared across ACEDP schemas):
#   - Keys/field names use snake_case; identifiers are "<section>_id".
#   - Each field is documented as: { type, required, description }.
#   - "type: list" sections describe a repeating element under "items:".
#   - "type: reference" fields describe a structured external link under "fields:".
#   - Enum values are listed under "allowed:".
#   - metadata.schema_version is the AUTHORITATIVE schema version.
#   - Internal links use a bare local "<section>_id"; external links are structured.
#   - Provisional choices are marked inline with "# OPEN:".
# =============================================================================

# ----------------------------------------------------------------------------
# metadata — about the Engineering Review record itself
# ----------------------------------------------------------------------------
metadata:
  review_id:
    type: string
    required: true
    description: Stable, unique identifier for this review record.
  review_name:
    type: string
    required: true
    description: Human-readable name of the review.
  schema_version:
    type: string
    required: true
    description: AUTHORITATIVE version of this schema the record conforms to (e.g. "1.0").
  document_reference:
    type: string
    required: true
    description: Source specification. Fixed value "SPEC-003".
  status:
    type: string
    required: true
    description: Lifecycle status of the review record.
    allowed: [Draft, In Review, Approved, Superseded]   # per STD-001
  version:
    type: string
    required: true
    description: Record version as MAJOR.MINOR (per STD-001 versioning).
  created_date:
    type: date
    required: true
    description: Date the review record was created (ISO 8601, YYYY-MM-DD).
  last_updated:
    type: date
    required: true
    description: Date the review record was last changed (ISO 8601).
  author:
    type: string
    required: false
    description: Role or identity that authored the review record.
  owner:
    type: string
    required: false
    description: Role accountable for the review record.

# ----------------------------------------------------------------------------
# references — standardized structured links to external artifacts
# (e.g. applicable standards/specs or related reviews. The specific artifacts
#  under review are detailed in "artifacts_reviewed".)
# ----------------------------------------------------------------------------
references:
  type: list
  required: false
  description: Structured links to external artifacts or instances.
  items:
    reference_id:
      type: string
      required: true
      description: Local identifier for this reference entry.
    ref_document:
      type: string
      required: true
      description: Source specification or artifact type (e.g. "STD-001").
    ref_id:
      type: string
      required: true
      description: Identifier of the referenced instance.
    ref_version:
      type: string
      required: false
      description: Version of the referenced instance, if pinned.
    relationship:
      type: string
      required: false
      description: Nature of the link (e.g. "governed_by", "relates_to").

# ----------------------------------------------------------------------------
# review_scope — what this review covers
# ----------------------------------------------------------------------------
review_scope:
  description:
    type: string
    required: true
    description: Summary of what the review covers.
  review_type:
    type: string
    required: false
    description: Kind of review being performed.
    allowed: [initial, re_review, gate]
  in_scope:
    type: list[string]
    required: false
    description: Aspects explicitly within the review's scope.
  out_of_scope:
    type: list[string]
    required: false
    description: Aspects explicitly excluded from the review.

# ----------------------------------------------------------------------------
# artifacts_reviewed — the artifacts evaluated (each via a structured reference)
# ----------------------------------------------------------------------------
artifacts_reviewed:
  type: list
  required: true
  description: Artifacts evaluated in this review.
  items:
    artifact_id:
      type: string
      required: true
      description: Local identifier for the reviewed artifact entry.
    artifact_reference:
      type: reference
      required: true
      description: Structured link to the artifact under review.
      fields:
        ref_document:
          type: string
          required: true
          description: Source specification or artifact type (e.g. "SPEC-001").
        ref_id:
          type: string
          required: true
          description: Identifier of the reviewed artifact instance.
        ref_version:
          type: string
          required: false
          description: Version of the artifact that was reviewed.
    title:
      type: string
      required: false
      description: Human-readable title of the artifact.
    outcome:
      type: string
      required: false
      description: Per-artifact result of the review.
      allowed: [approved, changes_required, rejected, pending]

# ----------------------------------------------------------------------------
# review_criteria — the criteria the artifacts were assessed against
# ----------------------------------------------------------------------------
review_criteria:
  type: list
  required: true
  description: Criteria applied during the review.
  items:
    criterion_id:
      type: string
      required: true
      description: Unique identifier for the criterion.
    description:
      type: string
      required: true
      description: The criterion being assessed.
    basis_reference:
      type: reference
      required: false
      description: Structured link to the standard/spec the criterion derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Source document (e.g. "STD-001").
        ref_id:
          type: string
          required: false
          description: Specific clause/section identifier, if applicable.
    result:
      type: string
      required: false
      description: Assessment outcome for this criterion.
      allowed: [met, partial, not_met, not_assessed]

# ----------------------------------------------------------------------------
# findings — issues and observations raised during the review
# ----------------------------------------------------------------------------
findings:
  type: list
  required: true
  description: Findings raised during the review.
  items:
    finding_id:
      type: string
      required: true
      description: Unique identifier for the finding.
    description:
      type: string
      required: true
      description: The issue or observation.
    severity:
      type: string
      required: true
      description: >-
        Severity of the finding. "blocking" means the finding prevents a
        mandatory criterion from being satisfied, violates a binding standard
        (STD-001 / STD-001.1), or violates an ADR-0008 must-not boundary; an
        artifact with an open blocking finding cannot be Approved.
        "major", "minor", and "informational" are non-blocking.
      allowed: [blocking, major, minor, informational]
    related_criterion:
      type: string
      required: false
      description: Internal link to a review_criteria.criterion_id.
    related_artifact:
      type: string
      required: false
      description: Internal link to an artifacts_reviewed.artifact_id.
    status:
      type: string
      required: false
      description: >-
        Resolution state of the finding. A blocking finding may be cleared only
        by "resolved" or "waived"; a waiver requires recorded justification by
        the artifact's approval authority (see SPEC-003).
      allowed: [open, resolved, waived]

# ----------------------------------------------------------------------------
# risk_assessment — risks identified by the review
# ----------------------------------------------------------------------------
risk_assessment:
  type: list
  required: false
  description: Risks identified during the review.
  items:
    risk_id:
      type: string
      required: true
      description: Unique identifier for the risk.
    description:
      type: string
      required: true
      description: The risk.
    likelihood:
      type: string
      required: false
      description: Probability of the risk occurring.
      allowed: [high, medium, low]
    impact:
      type: string
      required: false
      description: Consequence if the risk occurs.
      allowed: [high, medium, low]
    rating:
      type: string
      required: false
      description: Overall risk rating.
      allowed: [high, medium, low]
    mitigation:
      type: string
      required: false
      description: Proposed mitigation or response.
    related_finding:
      type: string
      required: false
      description: Internal link to a findings.finding_id.

# ----------------------------------------------------------------------------
# required_changes — changes the review requires before approval
# ----------------------------------------------------------------------------
required_changes:
  type: list
  required: false
  description: Changes required as a result of the review.
  items:
    change_id:
      type: string
      required: true
      description: Unique identifier for the required change.
    description:
      type: string
      required: true
      description: The change required.
    related_finding:
      type: string
      required: false
      description: Internal link to a findings.finding_id.
    priority:
      type: string
      required: false
      description: Priority of the change.
      allowed: [blocking, high, medium, low]
    owner_role:
      type: string
      required: false
      description: Role responsible for making the change.
    status:
      type: string
      required: false
      description: Completion state of the change.
      allowed: [open, in_progress, done]

# ----------------------------------------------------------------------------
# open_questions — unresolved questions arising from the review
# ----------------------------------------------------------------------------
open_questions:
  type: list
  required: false
  description: Questions left unresolved by the review.
  items:
    question_id:
      type: string
      required: true
      description: Unique identifier for the question.
    description:
      type: string
      required: true
      description: The unresolved question.
    blocking:
      type: boolean
      required: false
      description: Whether this question blocks approval.
    owner_role:
      type: string
      required: false
      description: Role responsible for resolving the question.
    status:
      type: string
      required: false
      description: Resolution state.
      allowed: [open, answered]

# ----------------------------------------------------------------------------
# approvals — standard review/approval block: the approval decision(s)
# (For an Engineering Review this records the gate decision itself.)
# ----------------------------------------------------------------------------
approvals:
  type: list
  required: true
  description: Approval decision(s) produced by this review.
  items:
    approval_id:
      type: string
      required: true
      description: Unique identifier for the approval record.
    artifact:
      type: string
      required: true
      description: What is being approved (e.g. the reviewed artifact's name).
    decision:
      type: string
      required: true
      description: The approval decision.
      allowed: [approved, rejected, pending]
    authority:
      type: string
      required: true
      description: >-
        Canonical actor field — the role that made the decision. See the
        SPEC-003 approval-authority matrix for the authority per artifact class.
      allowed: [product_owner, lead_architect, implementation_engineer]
    review_reference:
      type: reference
      required: false
      description: Structured link to a related/prior review record, if any.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-003".
        ref_id:
          type: string
          required: true
          description: Identifier of the referenced review record.
    date:
      type: date
      required: false
      description: Date of the decision (ISO 8601).
    notes:
      type: string
      required: false
      description: Conditions or rationale attached to the decision.
