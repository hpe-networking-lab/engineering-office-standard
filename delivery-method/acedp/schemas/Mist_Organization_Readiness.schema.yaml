# =============================================================================
# Mist Organization Readiness Schema
# -----------------------------------------------------------------------------
# Schema Version:      1.0   (convenience copy; metadata.schema_version is authoritative)
# Status:              Approved
# Approved By:         lead_architect (technical approval)
# Approval Date:       2026-06-30
# Document Reference:  SPEC-006 Mist Organization Readiness
# Source of Truth:     acedp/docs/specifications/SPEC-006_Mist_Organization_Readiness.md
# Convention:          STD-001 "Schema Conventions"
#
# Purpose:
#   Documentation-first description of the canonical Mist Organization Readiness
#   ASSESSMENT record: it judges whether an approved Design Package carries
#   enough structured information to prepare a Mist organization before hardware
#   installation. It is an assessment, NOT a configuration generator.
#   NOT executable; no validation logic; no example/customer data; no Mist
#   configuration, IDs, tokens, or claim codes.
#
# Common envelope (STD-001):
#   metadata  ->  references  ->  <domain sections>  ->  approvals
#
# Conventions (shared across ACEDP schemas):
#   - Keys/field names use snake_case; identifiers are "<section>_id".
#   - Each field is documented as: { type, required, description }.
#   - "type: list" sections describe a repeating element under "items:".
#   - "type: reference" fields describe a structured external link under "fields:".
#   - Enum values are listed under "allowed:".
#   - metadata.schema_version is the AUTHORITATIVE schema version.
#   - Internal links use a bare local "<section>_id"; external links are structured.
#   - Constructs are NAMED for readiness assessment only; nothing is configured.
#   - Provisional choices are marked inline with "# OPEN:".
# =============================================================================

# ----------------------------------------------------------------------------
# metadata — about the readiness assessment record itself
# ----------------------------------------------------------------------------
metadata:
  readiness_id:
    type: string
    required: true
    description: Stable, unique identifier for this readiness assessment record.
  readiness_name:
    type: string
    required: true
    description: Human-readable name of the readiness assessment.
  schema_version:
    type: string
    required: true
    description: AUTHORITATIVE version of this schema the record conforms to (e.g. "1.0").
  document_reference:
    type: string
    required: true
    description: Source specification. Fixed value "SPEC-006".
  status:
    type: string
    required: true
    description: Lifecycle status of the readiness record.
    allowed: [Draft, In Review, Approved, Superseded]   # per STD-001
  version:
    type: string
    required: true
    description: Record version as MAJOR.MINOR (per STD-001 versioning).
  created_date:
    type: date
    required: true
    description: Date the record was created (ISO 8601, YYYY-MM-DD).
  last_updated:
    type: date
    required: true
    description: Date the record was last changed (ISO 8601).
  author:
    type: string
    required: false
    description: Role or identity that authored the record.
  owner:
    type: string
    required: false
    description: Role accountable for the record.

# ----------------------------------------------------------------------------
# references — structured links to external artifacts
# (Typically the approved Design Package (SPEC-005), and for context the Project
#  Profile (SPEC-001) and Customer Discovery (SPEC-002).)
# ----------------------------------------------------------------------------
references:
  type: list
  required: false
  description: Structured links to external artifacts or instances.
  items:
    reference_id:
      type: string
      required: true
      description: Local identifier for this reference entry.
    ref_document:
      type: string
      required: true
      description: Source specification or artifact type (e.g. "SPEC-005").
    ref_id:
      type: string
      required: true
      description: Identifier of the referenced instance.
    ref_version:
      type: string
      required: false
      description: Version of the referenced instance, if pinned.
    relationship:
      type: string
      required: false
      description: Nature of the link (e.g. "assessed_from").

# ----------------------------------------------------------------------------
# readiness_scope — what this assessment covers and its overall determination
# ----------------------------------------------------------------------------
readiness_scope:
  objective:
    type: string
    required: true
    description: The readiness question this assessment answers.
  description:
    type: string
    required: false
    description: Narrative description of the assessment scope.
  in_scope:
    type: list[string]
    required: false
    description: Aspects explicitly within the assessment's scope.
  out_of_scope:
    type: list[string]
    required: false
    description: Aspects explicitly excluded (e.g. day-2 operations).
  overall_readiness:
    type: string
    required: false
    description: >-
      Overall readiness determination, per the SPEC-006 threshold:
      "ready" = all mandatory categories sufficient and no open blocking gap;
      "partial" = all mandatory categories sufficient with non-blocking gaps
      remaining; "not_ready" = any mandatory category insufficient/not_assessed,
      or any open blocking gap.
    allowed: [not_ready, partial, ready]
  rationale:
    type: string
    required: false
    description: Justification for the overall determination.

# ----------------------------------------------------------------------------
# readiness_categories — per-category sufficiency assessment (SPEC-006)
# ----------------------------------------------------------------------------
readiness_categories:
  type: list
  required: true
  description: Assessment of each readiness category.
  items:
    category_id:
      type: string
      required: true
      description: Local identifier for the category entry.
    category:
      type: string
      required: false
      description: The readiness category being assessed.
      allowed: [org_site_structure, network_addressing, wireless,
                wired_switching, security_segmentation, template,
                inventory_assignment, documentation]
    description:
      type: string
      required: false
      description: What the category assessment considered.
    status:
      type: string
      required: false
      description: Sufficiency of structured information for this category.
      allowed: [sufficient, partial, insufficient, not_assessed]
    mandatory:
      type: boolean
      required: false
      description: >-
        Whether this category is mandatory for this engagement. Per SPEC-006:
        org_site_structure, network_addressing, security_segmentation, template,
        and inventory_assignment are always mandatory; wireless and
        wired_switching are mandatory only when WLAN or switching are in scope;
        documentation is recommended.
    notes:
      type: string
      required: false
      description: Observations about the category.

# ----------------------------------------------------------------------------
# required_mist_constructs — constructs the design must be able to populate
# (named at definition level only; nothing is configured)
# ----------------------------------------------------------------------------
required_mist_constructs:
  type: list
  required: true
  description: Mist constructs assessed for preparation readiness.
  items:
    construct_id:
      type: string
      required: true
      description: Local identifier for the construct entry.
    construct:
      type: string
      required: false
      description: The construct being assessed.
      allowed: [organization, site, site_group, network_template, wlan_template,
                rf_template, switch_template, network_policy, segmentation,
                inventory_assignment]
    description:
      type: string
      required: false
      description: What the design provides toward this construct.
    readiness_status:
      type: string
      required: false
      description: Whether information to prepare the construct is present.
      allowed: [present, partial, missing, not_assessed]
    category_ref:
      type: string
      required: false
      description: Internal link to a readiness_categories.category_id.

# ----------------------------------------------------------------------------
# readiness_findings — observations raised by the assessment
# ----------------------------------------------------------------------------
readiness_findings:
  type: list
  required: false
  description: Findings raised during the readiness assessment.
  items:
    finding_id:
      type: string
      required: true
      description: Unique identifier for the finding.
    description:
      type: string
      required: true
      description: The observation.
    category_ref:
      type: string
      required: false
      description: Internal link to a readiness_categories.category_id.
    severity:
      type: string
      required: false
      description: >-
        Severity of the finding. "blocking" is defined in SPEC-003 (prevents a
        mandatory criterion, violates a binding standard, or violates an
        ADR-0008 must-not boundary).
      allowed: [blocking, major, minor, informational]
    status:
      type: string
      required: false
      description: Resolution state of the finding.
      allowed: [open, resolved]

# ----------------------------------------------------------------------------
# gaps — missing information preventing readiness
# ----------------------------------------------------------------------------
gaps:
  type: list
  required: false
  description: Gaps blocking organization preparation.
  items:
    gap_id:
      type: string
      required: true
      description: Unique identifier for the gap.
    description:
      type: string
      required: true
      description: The missing information or prerequisite.
    category_ref:
      type: string
      required: false
      description: Internal link to a readiness_categories.category_id.
    blocking:
      type: boolean
      required: false
      description: Whether the gap blocks organization preparation.
    remediation:
      type: string
      required: false
      description: What is required to close the gap.
    owner_role:
      type: string
      required: false
      description: Role responsible for closing the gap.
    status:
      type: string
      required: false
      description: Closure state of the gap.
      allowed: [open, in_progress, closed]

# ----------------------------------------------------------------------------
# risks — risks associated with proceeding to organization preparation
# ----------------------------------------------------------------------------
risks:
  type: list
  required: false
  description: Risks identified by the assessment.
  items:
    risk_id:
      type: string
      required: true
      description: Unique identifier for the risk.
    description:
      type: string
      required: true
      description: The risk.
    likelihood:
      type: string
      required: false
      description: Probability of the risk occurring.
      allowed: [high, medium, low]
    impact:
      type: string
      required: false
      description: Consequence if the risk occurs.
      allowed: [high, medium, low]
    rating:
      type: string
      required: false
      description: Overall risk rating.
      allowed: [high, medium, low]
    mitigation:
      type: string
      required: false
      description: Proposed mitigation or response.

# ----------------------------------------------------------------------------
# assumptions — assumptions underlying the assessment
# ----------------------------------------------------------------------------
assumptions:
  type: list
  required: false
  description: Working assumptions underlying the assessment.
  items:
    assumption_id:
      type: string
      required: true
      description: Unique identifier for the assumption.
    description:
      type: string
      required: true
      description: The assumption being made.
    status:
      type: string
      required: false
      description: Confirmation state of the assumption.
      allowed: [open, confirmed, invalidated]
    impact:
      type: string
      required: false
      description: Consequence if the assumption proves false.

# ----------------------------------------------------------------------------
# open_questions — unresolved questions about readiness
# ----------------------------------------------------------------------------
open_questions:
  type: list
  required: false
  description: Questions left unresolved by the assessment.
  items:
    question_id:
      type: string
      required: true
      description: Unique identifier for the question.
    description:
      type: string
      required: true
      description: The unresolved question.
    blocking:
      type: boolean
      required: false
      description: Whether this question blocks organization preparation.
    owner_role:
      type: string
      required: false
      description: Role responsible for resolving the question.
    status:
      type: string
      required: false
      description: Resolution state.
      allowed: [open, answered]

# ----------------------------------------------------------------------------
# approvals — standard review/approval block (readiness approval)
# ----------------------------------------------------------------------------
approvals:
  type: list
  required: false
  description: Approval decisions taken via Engineering Review (SPEC-003).
  items:
    approval_id:
      type: string
      required: true
      description: Unique identifier for the approval record.
    artifact:
      type: string
      required: true
      description: What is being approved (e.g. "Mist Organization Readiness").
    decision:
      type: string
      required: true
      description: The approval decision.
      allowed: [approved, rejected, pending]
    authority:
      type: string
      required: true
      description: >-
        Canonical actor field — the role that made the decision. See the
        SPEC-003 approval-authority matrix for the authority per artifact class.
      allowed: [product_owner, lead_architect, implementation_engineer]
    review_reference:
      type: reference
      required: false
      description: Structured link to the Engineering Review (SPEC-003) record.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-003".
        ref_id:
          type: string
          required: true
          description: Identifier of the review record.
    date:
      type: date
      required: false
      description: Date of the decision (ISO 8601).
    notes:
      type: string
      required: false
      description: Conditions or rationale attached to the decision.
