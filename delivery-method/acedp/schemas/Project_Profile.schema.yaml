# =============================================================================
# Project Profile Schema
# -----------------------------------------------------------------------------
# Schema Version:      1.0   (convenience copy; metadata.schema_version is authoritative)
# Status:              Approved
# Approved By:         product_owner (approval)
# Approval Date:       2026-06-30
# Document Reference:  SPEC-001 Project Profile
# Source of Truth:     acedp/docs/specifications/SPEC-001_Project_Profile.md
#
# Purpose:
#   Documentation-first description of the canonical Project Profile data model.
#   Defines section names, fields, data types, required/optional flags, and
#   brief descriptions. NOT executable; no validation logic; no example data.
#
# Common envelope (shared by all ACEDP schemas):
#   metadata  ->  references  ->  <domain sections>  ->  approvals
#
# Conventions:
#   - Keys/field names use snake_case; identifiers are "<section>_id".
#   - Each field is documented as: { type, required, description }.
#   - "type: list" sections describe a repeating element under "items:".
#   - "type: reference" fields describe a structured external link under "fields:".
#   - Enum values are listed under "allowed:".
#   - metadata.schema_version is the AUTHORITATIVE schema version.
#   - Internal links use a bare local "<section>_id" value.
#   - External links use the standardized "references" section or a structured
#     "type: reference" field — never free-text.
#   - Provisional choices are marked inline with "# OPEN:".
# =============================================================================

# ----------------------------------------------------------------------------
# metadata — about the Project Profile document itself
# ----------------------------------------------------------------------------
metadata:
  profile_id:
    type: string
    required: true
    description: Stable, unique identifier for this Project Profile.
  profile_name:
    type: string
    required: true
    description: Human-readable name of the profile.
  schema_version:
    type: string
    required: true
    description: AUTHORITATIVE version of this schema the profile conforms to (e.g. "1.0").
  document_reference:
    type: string
    required: true
    description: Source specification. Fixed value "SPEC-001".
  status:
    type: string
    required: true
    description: Lifecycle status of the profile.
    allowed: [Draft, In Review, Approved, Superseded]   # per STD-001
  version:
    type: string
    required: true
    description: Profile version as MAJOR.MINOR (per STD-001 versioning).
  created_date:
    type: date
    required: true
    description: Date the profile was created (ISO 8601, YYYY-MM-DD).
  last_updated:
    type: date
    required: true
    description: Date the profile was last changed (ISO 8601).
  author:
    type: string
    required: false
    description: Role or identity that authored the profile.
  owner:
    type: string
    required: false
    description: Role accountable for the profile's content.

# ----------------------------------------------------------------------------
# references — standardized structured links to external artifacts
# (A root Project Profile typically has none; section present for envelope
#  consistency. Internal links use bare "<section>_id", not this section.)
# ----------------------------------------------------------------------------
references:
  type: list
  required: false
  description: Structured links to external artifacts or instances.
  items:
    reference_id:
      type: string
      required: true
      description: Local identifier for this reference entry.
    ref_document:
      type: string
      required: true
      description: Source specification or artifact type (e.g. "SPEC-003").
    ref_id:
      type: string
      required: true
      description: Identifier of the referenced instance.
    ref_version:
      type: string
      required: false
      description: Version of the referenced instance, if pinned.
    relationship:
      type: string
      required: false
      description: Nature of the link (e.g. "derived_from", "relates_to").

# ----------------------------------------------------------------------------
# project — identity and framing of the engineering project
# ----------------------------------------------------------------------------
project:
  project_id:
    type: string
    required: true
    description: Stable, unique identifier for the project.
  name:
    type: string
    required: true
    description: Human-readable project name.
  summary:
    type: string
    required: true
    description: Concise description of the engineering project.
  type:
    type: string
    required: false
    description: Category/classification of the project.
  start_date:
    type: date
    required: false
    description: Planned or actual start date.
  target_date:
    type: date
    required: false
    description: Target completion or delivery date.

# ----------------------------------------------------------------------------
# customer — the engagement customer (field definitions only; no real data)
# ----------------------------------------------------------------------------
customer:
  customer_id:
    type: string
    required: true
    description: Stable, unique identifier for the customer.
  name:
    type: string
    required: true
    description: Customer name.
  industry:
    type: string
    required: false
    description: Customer industry or sector.
  primary_contact_role:
    type: string
    required: false
    description: Role of the primary contact (a role reference, not PII).
  notes:
    type: string
    required: false
    description: Non-sensitive contextual notes about the customer.

# ----------------------------------------------------------------------------
# business_objectives — the outcomes the project must achieve
# ----------------------------------------------------------------------------
business_objectives:
  type: list
  required: true
  description: One or more business objectives driving the project.
  items:
    objective_id:
      type: string
      required: true
      description: Unique identifier for the objective.
    description:
      type: string
      required: true
      description: What the objective is, in plain language.
    priority:
      type: string
      required: false
      description: Relative importance of the objective.
      allowed: [high, medium, low]
    measure:
      type: string
      required: false
      description: How achievement of the objective is measured.

# ----------------------------------------------------------------------------
# scope — explicit boundaries of the project
# ----------------------------------------------------------------------------
scope:
  in_scope:
    type: list[string]
    required: true
    description: Items explicitly within the project's scope.
  out_of_scope:
    type: list[string]
    required: true
    description: Items explicitly excluded from scope.
  description:
    type: string
    required: false
    description: Narrative clarification of scope boundaries.

# ----------------------------------------------------------------------------
# assumptions — things taken as true pending confirmation
# ----------------------------------------------------------------------------
assumptions:
  type: list
  required: false
  description: Working assumptions; unconfirmed items remain open.
  items:
    assumption_id:
      type: string
      required: true
      description: Unique identifier for the assumption.
    description:
      type: string
      required: true
      description: The assumption being made.
    status:
      type: string
      required: false
      description: Confirmation state of the assumption.
      allowed: [open, confirmed, invalidated]
    impact:
      type: string
      required: false
      description: Consequence if the assumption proves false.

# ----------------------------------------------------------------------------
# constraints — fixed limitations the project must respect
# ----------------------------------------------------------------------------
constraints:
  type: list
  required: false
  description: Known technical, operational, or other constraints.
  items:
    constraint_id:
      type: string
      required: true
      description: Unique identifier for the constraint.
    type:
      type: string
      required: false
      description: Category of constraint.
      allowed: [technical, operational, timing, regulatory, budget]
    description:
      type: string
      required: true
      description: The constraint itself.
    severity:
      type: string
      required: false
      description: How strongly the constraint limits the project.
      allowed: [high, medium, low]

# ----------------------------------------------------------------------------
# stakeholders — roles responsible for direction and approval
# ----------------------------------------------------------------------------
stakeholders:
  type: list
  required: true
  description: People/roles with a stake in the project.
  items:
    stakeholder_id:
      type: string
      required: true
      description: Unique identifier for the stakeholder.
    role:
      type: string
      required: true
      description: Stakeholder role (e.g. Product Owner, Lead Architect).
    responsibility:
      type: string
      required: false
      description: What this stakeholder is responsible for.
    approval_authority:
      type: boolean
      required: false
      description: >-
        Whether this stakeholder can grant approvals (see the SPEC-003
        approval-authority matrix).
    contact_reference:
      type: string
      required: false
      description: Indirect reference to contact details (not PII inline).

# ----------------------------------------------------------------------------
# success_criteria — conditions under which the project is judged complete
# ----------------------------------------------------------------------------
success_criteria:
  type: list
  required: true
  description: Measurable conditions that define project success.
  items:
    criterion_id:
      type: string
      required: true
      description: Unique identifier for the criterion.
    description:
      type: string
      required: true
      description: The success condition.
    measure:
      type: string
      required: true
      description: How the criterion is verified as met.
    linked_objective:
      type: string
      required: false
      description: Internal link to a business_objectives.objective_id.
    status:
      type: string
      required: false
      description: Current state of the criterion.
      allowed: [pending, met, not_met]

# ----------------------------------------------------------------------------
# approvals — standard review/approval block: a list of approval records
# (ties to Engineering Review, SPEC-003)
# ----------------------------------------------------------------------------
approvals:
  type: list
  required: false
  description: Approval decisions taken via Engineering Review (SPEC-003).
  items:
    approval_id:
      type: string
      required: true
      description: Unique identifier for the approval record.
    artifact:
      type: string
      required: true
      description: What was reviewed/approved (e.g. "Project Profile").
    decision:
      type: string
      required: true
      description: Outcome of the review.
      allowed: [approved, rejected, pending]
    authority:
      type: string
      required: true
      description: >-
        Canonical actor field — the role that made the decision. See the
        SPEC-003 approval-authority matrix for the authority per artifact class.
      allowed: [product_owner, lead_architect, implementation_engineer]
    review_reference:
      type: reference
      required: false
      description: Structured link to the Engineering Review (SPEC-003) record.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-003".
        ref_id:
          type: string
          required: true
          description: Identifier of the review record.
    date:
      type: date
      required: false
      description: Date of the decision (ISO 8601).
    notes:
      type: string
      required: false
      description: Findings or conditions attached to the decision.
