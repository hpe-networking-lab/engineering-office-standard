# =============================================================================
# Mist Organization Generation Schema
# -----------------------------------------------------------------------------
# Schema Version:      1.0   (convenience copy; metadata.schema_version is authoritative)
# Status:              Approved
# Approved By:         lead_architect (technical approval), product_owner (implementation authorization), implementation_engineer (implementation readiness)
# Approval Date:       2026-06-30
# Document Reference:  SPEC-007 Mist Organization Generation
# Source of Truth:     acedp/docs/specifications/SPEC-007_Mist_Organization_Generation.md
# Convention:          STD-001 "Schema Conventions"
#
# Purpose:
#   Documentation-first description of the canonical Mist Organization
#   Generation INTENT record: what a Mist organization should be prepared to
#   contain, derived from an approved Design Package and an approved "ready"
#   Mist Organization Readiness assessment.
#
#   This is INTENT only. It is NOT executable, NOT a configuration, and NOT an
#   API definition. It MUST NOT contain generated Mist configuration, API
#   payloads, organization IDs, API tokens, claim codes, secrets, or example
#   customer data. Fields below define structure only; they hold no values here.
#
# Traceability:
#   Each *_intent item carries a structured "design_reference" (to SPEC-005)
#   so it can trace back to a Design Package element. See the SPEC-007
#   Design-to-Mist Mapping for the element-to-object mapping.
#
# Common envelope (STD-001):
#   metadata  ->  references  ->  <domain sections>  ->  approvals
#
# Conventions (shared across ACEDP schemas):
#   - Keys/field names use snake_case; identifiers are "<section>_id".
#   - Each field is documented as: { type, required, description }.
#   - "type: list" sections describe a repeating element under "items:".
#   - "type: reference" fields describe a structured external link under "fields:".
#   - Enum values are listed under "allowed:".
#   - metadata.schema_version is the AUTHORITATIVE schema version.
#   - Internal links use a bare local "<section>_id"; external links are structured.
#   - "*_intent" sections express intent only; nothing is configured.
#   - Provisional choices are marked inline with "# OPEN:".
# =============================================================================

# ----------------------------------------------------------------------------
# metadata — about the generation intent record itself
# ----------------------------------------------------------------------------
metadata:
  generation_id:
    type: string
    required: true
    description: Stable, unique identifier for this generation intent record.
  generation_name:
    type: string
    required: true
    description: Human-readable name of the generation intent record.
  schema_version:
    type: string
    required: true
    description: AUTHORITATIVE version of this schema the record conforms to (e.g. "1.0").
  document_reference:
    type: string
    required: true
    description: Source specification. Fixed value "SPEC-007".
  status:
    type: string
    required: true
    description: Lifecycle status of the generation intent record.
    allowed: [Draft, In Review, Approved, Superseded]   # per STD-001
  version:
    type: string
    required: true
    description: Record version as MAJOR.MINOR (per STD-001 versioning).
  created_date:
    type: date
    required: true
    description: Date the record was created (ISO 8601, YYYY-MM-DD).
  last_updated:
    type: date
    required: true
    description: Date the record was last changed (ISO 8601).
  author:
    type: string
    required: false
    description: Role or identity that authored the record.
  owner:
    type: string
    required: false
    description: Role accountable for the record.

# ----------------------------------------------------------------------------
# references — structured links to external artifacts
# (Typically the approved Design Package (SPEC-005) and the approved "ready"
#  Mist Organization Readiness assessment (SPEC-006); context SPEC-001/002.)
# ----------------------------------------------------------------------------
references:
  type: list
  required: false
  description: Structured links to external artifacts or instances.
  items:
    reference_id:
      type: string
      required: true
      description: Local identifier for this reference entry.
    ref_document:
      type: string
      required: true
      description: Source specification or artifact type (e.g. "SPEC-005").
    ref_id:
      type: string
      required: true
      description: Identifier of the referenced instance.
    ref_version:
      type: string
      required: false
      description: Version of the referenced instance, if pinned.
    relationship:
      type: string
      required: false
      description: Nature of the link (e.g. "generated_from", "gated_by").

# ----------------------------------------------------------------------------
# generation_scope — what this generation intent covers
# ----------------------------------------------------------------------------
generation_scope:
  objective:
    type: string
    required: true
    description: The generation objective this intent addresses.
  description:
    type: string
    required: false
    description: Narrative description of the generation scope.
  in_scope:
    type: list[string]
    required: true
    description: Aspects explicitly within the generation intent's scope.
  out_of_scope:
    type: list[string]
    required: true
    description: Aspects explicitly excluded (e.g. automation, deployment).

# ----------------------------------------------------------------------------
# organization_intent — intended organization-level structure
# (maps from the design's site structure)
# ----------------------------------------------------------------------------
organization_intent:
  summary:
    type: string
    required: true
    description: Intended high-level structure of the organization.
  structure_intent:
    type: string
    required: false
    description: How the organization is intended to be organized.
  design_reference:
    type: reference
    required: false
    description: Structured link to the Design Package element this intent derives from.
    fields:
      ref_document:
        type: string
        required: true
        description: Fixed value "SPEC-005".
      ref_path:
        type: string
        required: false
        description: Dotted path to the design element (e.g. "design_scope").
  notes:
    type: string
    required: false
    description: Additional organization-level intent notes (no IDs/secrets).

# ----------------------------------------------------------------------------
# site_intent — intended sites and site groups (maps from site structure)
# ----------------------------------------------------------------------------
site_intent:
  type: list
  required: false
  description: Intended sites and site groups (derived from the design).
  items:
    site_id:
      type: string
      required: true
      description: Local identifier for the site entry.
    name_intent:
      type: string
      required: false
      description: Intended site name (descriptive intent, not a value).
    site_group:
      type: string
      required: false
      description: Intended site-group association.
    parent_site_group:
      type: string
      required: false
      description: Intended parent site group for this site (expresses site hierarchy).
    purpose:
      type: string
      required: false
      description: Purpose of the site in the design.
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element.

# ----------------------------------------------------------------------------
# template_intent — intended templates (maps from vlan_ip/wlan_ssid/switching)
# ----------------------------------------------------------------------------
template_intent:
  type: list
  required: false
  description: Templates the design implies should be prepared.
  items:
    template_id:
      type: string
      required: true
      description: Local identifier for the template entry.
    template_type:
      type: string
      required: false
      description: Kind of template.
      allowed: [network, switch, wlan, rf]
    scope_level:
      type: string
      required: false
      description: Level at which the template is intended to apply.
      allowed: [org, site_group, site]
    inherits_from:
      type: string
      required: false
      description: Internal link to another template_intent.template_id this template inherits from.
    purpose:
      type: string
      required: false
      description: What the template is intended to standardize.
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element (e.g. "vlan_ip_plan").
    notes:
      type: string
      required: false
      description: Template intent notes (no configuration values).

# ----------------------------------------------------------------------------
# wlan_intent — intended WLAN/SSID set (maps from wlan_ssid_plan)
# ----------------------------------------------------------------------------
wlan_intent:
  type: list
  required: false
  description: Intended WLANs/SSIDs (intent only).
  items:
    wlan_id:
      type: string
      required: true
      description: Local identifier for the WLAN entry.
    ssid_name_intent:
      type: string
      required: false
      description: Intended SSID name (descriptive intent).
    purpose:
      type: string
      required: false
      description: Intended use of the WLAN.
    security_intent:
      type: string
      required: false
      description: Intended security model.
      allowed: [open, psk, enterprise]
    template_ref:
      type: string
      required: false
      description: Internal link to a template_intent.template_id.
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element (e.g. "wlan_ssid_plan").

# ----------------------------------------------------------------------------
# switching_intent — intended switching roles (maps from switching_plan)
# ----------------------------------------------------------------------------
switching_intent:
  type: list
  required: false
  description: Intended switching roles (intent only).
  items:
    switching_id:
      type: string
      required: true
      description: Local identifier for the switching entry.
    role:
      type: string
      required: false
      description: Intended switching role.
      allowed: [access, distribution, core, collapsed_core]
    purpose:
      type: string
      required: false
      description: Role of this switching tier in the design.
    template_ref:
      type: string
      required: false
      description: Internal link to a template_intent.template_id.
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element (e.g. "switching_plan").

# ----------------------------------------------------------------------------
# policy_intent — intended policies (maps from security_segmentation_plan)
# ----------------------------------------------------------------------------
policy_intent:
  type: list
  required: false
  description: Intended policies and segmentation (intent only).
  items:
    policy_id:
      type: string
      required: true
      description: Local identifier for the policy entry.
    name_intent:
      type: string
      required: false
      description: Intended policy name (descriptive intent).
    purpose:
      type: string
      required: false
      description: What the policy is intended to enforce.
    action_intent:
      type: string
      required: false
      description: Intended policy action.
      allowed: [permit, deny, inspect, segment]
    scope_intent:
      type: string
      required: false
      description: Intended scope of the policy (described generically).
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element (e.g. "security_segmentation_plan").

# ----------------------------------------------------------------------------
# inventory_intent — intended device inventory/assignments (no claim codes)
# (maps to inventory assignment readiness)
# ----------------------------------------------------------------------------
inventory_intent:
  type: list
  required: false
  description: Intended device roles and assignments (no claim codes/serials).
  items:
    inventory_id:
      type: string
      required: true
      description: Local identifier for the inventory entry.
    device_role:
      type: string
      required: false
      description: Intended role of the device(s).
    quantity_intent:
      type: integer
      required: false
      description: Intended number of devices for this role.
    site_ref:
      type: string
      required: false
      description: Internal link to a site_intent.site_id.
    design_reference:
      type: reference
      required: false
      description: Structured link to the Design Package element this intent derives from.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-005".
        ref_path:
          type: string
          required: false
          description: Dotted path to the design element.

# ----------------------------------------------------------------------------
# pre_implementation_review — the gate state before any preparation begins
# ----------------------------------------------------------------------------
pre_implementation_review:
  status:
    type: string
    required: false
    description: State of the pre-implementation review.
    allowed: [pending, in_review, approved, rejected]
  prerequisites_confirmed:
    type: boolean
    required: false
    description: Whether the Design Package and a "ready" readiness assessment are approved.
  blocking_items:
    type: list[string]
    required: false
    description: Items that must be resolved before implementation may begin.
  review_reference:
    type: reference
    required: false
    description: Structured link to the Engineering Review (SPEC-003) record.
    fields:
      ref_document:
        type: string
        required: true
        description: Fixed value "SPEC-003".
      ref_id:
        type: string
        required: true
        description: Identifier of the review record.
  notes:
    type: string
    required: false
    description: Notes on the pre-implementation review.

# ----------------------------------------------------------------------------
# risks — risks associated with proceeding to organization preparation
# ----------------------------------------------------------------------------
risks:
  type: list
  required: false
  description: Risks identified for the generation intent.
  items:
    risk_id:
      type: string
      required: true
      description: Unique identifier for the risk.
    description:
      type: string
      required: true
      description: The risk.
    likelihood:
      type: string
      required: false
      description: Probability of the risk occurring.
      allowed: [high, medium, low]
    impact:
      type: string
      required: false
      description: Consequence if the risk occurs.
      allowed: [high, medium, low]
    rating:
      type: string
      required: false
      description: Overall risk rating.
      allowed: [high, medium, low]
    mitigation:
      type: string
      required: false
      description: Proposed mitigation or response.

# ----------------------------------------------------------------------------
# assumptions — assumptions underlying the generation intent
# ----------------------------------------------------------------------------
assumptions:
  type: list
  required: false
  description: Working assumptions underlying the generation intent.
  items:
    assumption_id:
      type: string
      required: true
      description: Unique identifier for the assumption.
    description:
      type: string
      required: true
      description: The assumption being made.
    status:
      type: string
      required: false
      description: Confirmation state of the assumption.
      allowed: [open, confirmed, invalidated]
    impact:
      type: string
      required: false
      description: Consequence if the assumption proves false.

# ----------------------------------------------------------------------------
# open_questions — unresolved questions about the generation intent
# ----------------------------------------------------------------------------
open_questions:
  type: list
  required: false
  description: Questions left unresolved by the generation intent.
  items:
    question_id:
      type: string
      required: true
      description: Unique identifier for the question.
    description:
      type: string
      required: true
      description: The unresolved question.
    blocking:
      type: boolean
      required: false
      description: Whether this question blocks implementation.
    owner_role:
      type: string
      required: false
      description: Role responsible for resolving the question.
    status:
      type: string
      required: false
      description: Resolution state.
      allowed: [open, answered]

# ----------------------------------------------------------------------------
# approvals — standard review/approval block (generation intent approval)
# ----------------------------------------------------------------------------
approvals:
  type: list
  required: false
  description: Approval decisions taken via Engineering Review (SPEC-003).
  items:
    approval_id:
      type: string
      required: true
      description: Unique identifier for the approval record.
    artifact:
      type: string
      required: true
      description: What is being approved (e.g. "Mist Organization Generation").
    decision:
      type: string
      required: true
      description: The approval decision.
      allowed: [approved, rejected, pending]
    authority:
      type: string
      required: true
      description: >-
        Canonical actor field — the role that made the decision. See the
        SPEC-003 approval-authority matrix for the authority per artifact class.
      allowed: [product_owner, lead_architect, implementation_engineer]
    review_reference:
      type: reference
      required: false
      description: Structured link to the Engineering Review (SPEC-003) record.
      fields:
        ref_document:
          type: string
          required: true
          description: Fixed value "SPEC-003".
        ref_id:
          type: string
          required: true
          description: Identifier of the review record.
    date:
      type: date
      required: false
      description: Date of the decision (ISO 8601).
    notes:
      type: string
      required: false
      description: Conditions or rationale attached to the decision.
